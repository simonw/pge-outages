name: Fetch latest outages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
  - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: fetch-outages
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install Python tools
      run: pip install -r requirements.txt
    - name: Run regression tests
      run: python -m unittest discover -s tests -v
    - name: Fetch, validate and generate commit message
      run: python fetch_outages.py
    - name: Commit and push
      run: bash scripts/commit-outages.sh
